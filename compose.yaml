services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: air_quality
      POSTGRES_USER: air_quality
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air_quality -d air_quality"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: